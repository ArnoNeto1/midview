# Builds the setup program (MidviewSetup.exe, its version in its properties) with
# installer\Gerar-Instalador.ps1 and checks its scripts, both under Windows
# PowerShell 5.1 -- the PowerShell lab machines run them with. Run by hand
# ("Run workflow"), it also keeps the setup for download for 7 days
# (artifact storage is small on the free plan, so not on every run); for a
# pushed v* tag, it attaches the setup to that GitHub Release. Run by hand on
# master with "publicar", it publishes the version itself: it creates the
# v<Version> tag (Directory.Build.props) on that commit and its Release, with
# the setup and the given notes -- for when pushing a tag isn't at hand. A
# version already published is refused, never overwritten. Once the phone app
# is enabled (PhoneProvisioning.SignatureChecksum is no longer the placeholder)
# this path is refused: a tag made with the workflow's own token doesn't start
# android.yml, so the version would come out without MidviewAgent.apk; publish
# by pushing the annotated tag instead.
name: Instalador

on:
  push:
    branches: [master]
    # GitHub ignores the path filters below for tag pushes.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'installer/**'
      - 'Directory.Build.props'
      - '.github/workflows/pacote.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'Directory.Build.props'
      - '.github/workflows/pacote.yml'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar a versão (tag v<versão> e Release com o instalador); só no master'
        type: boolean
        default: false
      notas:
        description: 'Texto da versão (Markdown), ao publicar'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pacote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacote:
    name: Gerar e conferir o instalador
    runs-on: windows-latest
    timeout-minutes: 30
    # Creating a release needs write access to the repository's contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar o Inno Setup (se faltar)
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # powershell.exe is Windows PowerShell 5.1 (pwsh would be 7).
      - name: Gerar o instalador (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\Gerar-Instalador.ps1 -Output "%RUNNER_TEMP%\Midview-Instalador"

      - name: Conferir os scripts (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\tests\Testar-Scripts.ps1 -Pacote "%RUNNER_TEMP%\Midview-Instalador"

      - name: Guardar o instalador para download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MidviewSetup
          path: ${{ runner.temp }}/Midview-Instalador/MidviewSetup.exe
          retention-days: 7

      - name: Publicar na versão (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/Midview-Instalador/MidviewSetup.exe

      - name: Conferir a versão a publicar
        id: versao
        if: github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $versao = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          if (-not $versao) { throw 'Directory.Build.props sem <Version>.' }
          $celular = Select-String -Path src/Midview.Master/PhoneProvisioning.cs -Pattern 'SignatureChecksum = "([^"]+)"'
          if (-not $celular) { throw 'PhoneProvisioning.SignatureChecksum não encontrado.' }
          if ($celular.Matches[0].Groups[1].Value -ne 'PREENCHER-NA-TASK-9') {
            throw 'O app do celular já está habilitado: uma tag criada por aqui não inicia o fluxo Android e a versão sairia sem o MidviewAgent.apk. Publique empurrando a tag anotada (git tag -a v<versão> -m "..." e git push origin v<versão>).'
          }
          if (git ls-remote --tags origin "refs/tags/v$versao") { throw "A versão v$versao já foi publicada." }
          "tag=v$versao" >> $env:GITHUB_OUTPUT
          "nome=Versão $versao" >> $env:GITHUB_OUTPUT

      # The tag this creates, made with the workflow's own token, doesn't
      # start the tag run above again.
      - name: Publicar a versão (Run workflow, publicar)
        if: steps.versao.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.versao.outputs.nome }}
          body: ${{ inputs.notas }}
          files: ${{ runner.temp }}/Midview-Instalador/MidviewSetup.exe
