# Builds the setup program (MidviewSetup.exe, its version in its properties) with
# installer\Gerar-Instalador.ps1 and checks its scripts, both under Windows
# PowerShell 5.1 -- the PowerShell lab machines run them with. Run by hand
# ("Run workflow"), it also keeps the setup for download for 7 days
# (artifact storage is small on the free plan, so not on every run); for a
# pushed v* tag, it attaches the setup to that GitHub Release.
name: Instalador

on:
  push:
    branches: [master]
    # GitHub ignores the path filters below for tag pushes.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'installer/**'
      - 'Directory.Build.props'
      - '.github/workflows/pacote.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'Directory.Build.props'
      - '.github/workflows/pacote.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacote:
    name: Gerar e conferir o instalador
    runs-on: windows-latest
    timeout-minutes: 30
    # Creating a release needs write access to the repository's contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar o Inno Setup (se faltar)
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # powershell.exe is Windows PowerShell 5.1 (pwsh would be 7).
      - name: Gerar o instalador (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\Gerar-Instalador.ps1 -Output "%RUNNER_TEMP%\Midview-Instalador"

      - name: Conferir os scripts (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\tests\Testar-Scripts.ps1 -Pacote "%RUNNER_TEMP%\Midview-Instalador"

      - name: Guardar o instalador para download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MidviewSetup
          path: ${{ runner.temp }}/Midview-Instalador/MidviewSetup.exe
          retention-days: 7

      - name: Publicar na versão (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/Midview-Instalador/MidviewSetup.exe
