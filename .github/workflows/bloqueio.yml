# Installs Midview on a real Windows machine (the runner, a throwaway VM)
# with the lab installer and blocks programs for real: a program with a
# limited token (like a student's) must be ended by a block list, and by
# allow only when it isn't allowed, while an elevated program, Windows and
# the shell are never touched; the block must survive restarting the
# service, be lifted on request and be undone by the uninstaller
# (installer/tests/Testar-Bloqueio.ps1). A Windows runner bills 2x the
# minutes of a Linux one, so this runs only for changes to what it exercises.
name: Bloqueio de programas (Windows de verdade)

on:
  push:
    branches: [master]
    paths:
      - 'src/Midview.Agent/**'
      - 'src/Midview.Protocol/**'
      - 'src/Midview.Session/OpenProgramsList.cs'
      - 'src/Midview.Master/AppBlock*'
      - 'src/Midview.Master/CommandClient.cs'
      - 'installer/**'
      - 'tests/Midview.E2E/**'
      - '.github/workflows/bloqueio.yml'
  pull_request:
    paths:
      - 'src/Midview.Agent/**'
      - 'src/Midview.Protocol/**'
      - 'src/Midview.Session/OpenProgramsList.cs'
      - 'src/Midview.Master/AppBlock*'
      - 'src/Midview.Master/CommandClient.cs'
      - 'installer/**'
      - 'tests/Midview.E2E/**'
      - '.github/workflows/bloqueio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloqueio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bloqueio:
    name: Bloquear programas de verdade
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # powershell.exe is Windows PowerShell 5.1, what lab machines run.
      - name: Gerar o pacote (Windows PowerShell 5.1)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\Gerar-Pacote.ps1 -Output "%RUNNER_TEMP%\Midview-Instalacao"

      - name: Compilar o professor de teste
        run: dotnet build tests/Midview.E2E --configuration Release --output "${{ runner.temp }}/professor-de-teste"

      - name: Instalar, bloquear programas, reiniciar o serviço, liberar e desinstalar
        shell: cmd
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\tests\Testar-Bloqueio.ps1
          -Pacote "%RUNNER_TEMP%\Midview-Instalacao"
          -Ferramenta "%RUNNER_TEMP%\professor-de-teste\Midview.E2E.exe"
          -Registros "%RUNNER_TEMP%\registros-bloqueio"

      - name: Guardar os registros do Agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-do-bloqueio
          path: ${{ runner.temp }}/registros-bloqueio
          retention-days: 7
          if-no-files-found: ignore
